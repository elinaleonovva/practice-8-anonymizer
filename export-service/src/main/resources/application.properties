server.port=8080
spring.application.name=export-service
spring.main.web-application-type=reactive
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/export_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:platform_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:platform_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
dataset-service.url=${DATASET_SERVICE_URL:http://localhost:8081}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Two short requests and a Circuit Breaker prevent an indefinite wait for Dataset Service.
resilience4j.retry.instances.datasetService.max-attempts=2
resilience4j.retry.instances.datasetService.wait-duration=250ms
resilience4j.circuitbreaker.instances.datasetService.sliding-window-size=2
resilience4j.circuitbreaker.instances.datasetService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.datasetService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.datasetService.wait-duration-in-open-state=5s
