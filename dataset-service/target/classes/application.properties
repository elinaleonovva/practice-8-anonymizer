server.port=8080
spring.application.name=dataset-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dataset_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:platform_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:platform_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
