server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: datasets
          uri: http://dataset-service:8080
          predicates:
            - Path=/api/datasets/**
        - id: exports
          uri: http://export-service:8080
          predicates:
            - Path=/api/exports/**
        - id: anonymizations
          uri: http://anonymizer-service:8080
          predicates:
            - Path=/api/anonymizations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
